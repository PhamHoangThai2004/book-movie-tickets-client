name: client
description: "BOOKING MOVIE TICKETS APP"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  # Icons for iOS.
  cupertino_icons: ^1.0.8

  # UI
  flutter_screenutil: ^5.9.3
  google_fonts: ^8.0.2

  # Network
  dio: ^5.9.2
  curl_logger_dio_interceptor: ^1.0.1
  internet_connection_checker_plus: ^2.9.1+2

  # Router
  go_router: ^17.1.0

  # Local storage
  shared_preferences: ^2.5.4

  # Dependency injection
  get_it: ^9.2.1
  injectable: ^2.7.1+4

  # Utils
  intl: ^0.20.2
  easy_localization: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: ^2.12.1
  build_runner: ^2.12.2
  flutter_gen_runner: ^5.13.0+1

flutter_gen:
  output: lib/generated/

  integrations:
    flutter_svg: true
    lottie: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/svgs/
    - assets/translations/